<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Визуальная Новелла</title>
  <style>
    /* Базовые мобильные настройки */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #1a1a1a;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: url('fon.jpg') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Элементы прижаты к низу */
      padding: 16px;
    }

    /* Контейнер для спрайта персонажа */
    #character-container {
      width: 100%;
      display: flex;
      justify-content: center; /* Центрируем персонажа по горизонтали */
      align-items: flex-end;
      flex-grow: 1; /* Занимает все свободное пространство над текстом */
      margin-bottom: -10px; /* Слегка заводим персонажа за текстовое поле для эффекта глубины */
      z-index: 1;
      pointer-events: none; /* Чтобы клики проходили сквозь пустое место спрайта */
    }

    /* Стили самого изображения персонажа */
    #character-img {
      max-width: 85%; /* Чтобы персонаж не был слишком огромным на экране телефона */
      max-height: 50vh; /* Ограничиваем высоту до половины экрана */
      object-fit: contain;
      display: none; /* Появляется только когда задан в JS */
      /* Плавное появление персонажа */
      animation: fadeIn 0.4s ease-out;
    }

    /* Полупрозрачное диалоговое окно */
    #dialogue-box {
      position: relative;
      z-index: 2; /* Чтобы текст всегда был поверх персонажа */
      width: 100%;
      min-height: 140px;
      max-height: 40vh;
      background: rgba(15, 15, 25, 0.4); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12); 
      border-radius: 16px;
      padding: 16px 20px 12px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.2);
    }

    #text-box {
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 12px;
      overflow-y: auto;
    }

    #controls {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .clickable {
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .clickable:active {
      transform: scale(0.97);
    }

    /* Маленькая кнопка "Далее" справа */
    #next-btn {
      align-self: flex-end; 
      padding: 8px 20px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.15);
      min-width: 90px;
      text-align: center;
    }
    #next-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Кнопки выбора */
    #choices-container {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .choice-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: linear-gradient(135deg, rgba(106, 17, 203, 0.45), rgba(37, 117, 252, 0.45));
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .choice-btn:active {
      background: linear-gradient(135deg, rgba(106, 17, 203, 0.65), rgba(37, 117, 252, 0.65));
    }

    /* Анимация плавного появления */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Контейнер для отображения персонажей -->
    <div id="character-container">
      <img id="character-img" src="" alt="Персонаж">
    </div>

    <!-- Диалоговое окно -->
    <div id="dialogue-box">
      <div id="text-box">Загрузка истории...</div>
      
      <div id="controls">
        <button id="next-btn" class="clickable">Далее →</button>
        <div id="choices-container"></div>
      </div>
    </div>
  </div>

  <script>
    // В базу данных добавлен параметр characterImg. 
    // Замените названия файлов на свои (например: 'hero_scared.png', 'monster.png')
    const story = [
      { 
        id: 1, 
        text: "Ты открываешь глаза в роскошном зале, залитом неоновым светом, адским пламенем и блеском хекстека одновременно.", 
        type: "text", 
        next: 2,
        characterImg: null // В начале никого нет
      },
      { 
        id: 2, 
        text: "Сегодня твой День Рождения, и поздравить тебя пришли трое мужчин, каждый из которых готов на всё ради твоего внимания.", 
        type: "text", 
        next: 3,
        characterImg: null 
      },
      { 
        id: 3, 
        text: "Кто подойдёт к тебе первым?", 
        type: "choice", 
        choices: [
          { text: "Подойти к Рафаилу, который вальяжно крутит бокал вина", next: 4 },
          { text: "Подойти к Дотторе, чья маска загадочно поблескивает в темноте", next: 5 },
          { text: "Подойти к Виктору, который отвлекся от своих чертежей и тепло улыбнулся", next: 6 }
        ],
        characterImg: null // Окно выбора, персонаж появится ПОСЛЕ нажатия
      },
      // Сцены после выбора (здесь появляются картинки персонажей):
      { 
        id: 4, 
        text: "Вы трижды стучите по металлу. Из темноты за вашей спиной внезапно появляется Проводник: «Зачем ты шумишь?»", 
        type: "text", 
        next: null,
        characterImg: 'raphael.png' // Картинка для этого выбора
      },
      { 
        id: 5, 
        text: "Вы дергаете ручку! Дверь распахивается, и на вас бросается жуткий Призрак!", 
        type: "text", 
        next: null,
        characterImg: 'dottore.png' // Картинка для этого выбора
      },
      { 
        id: 6, 
        text: "Страх берет верх. Вы бежите обратно, но дорогу вам преграждает Незнакомец в плаще.", 
        type: "text", 
        next: null,
        characterImg: 'viktor.png' // Картинка для этого выбора
      }
    ];

    let currentStep = 1;

    function renderScene() {
      const scene = story.find(s => s.id === currentStep);
      if (!scene) return;

      // 1. Управление текстом
      document.getElementById("text-box").innerText = scene.text;
      
      // 2. Управление картинкой персонажа
      const charImgElement = document.getElementById("character-img");
      if (scene.characterImg) {
        charImgElement.src = scene.characterImg;
        charImgElement.style.display = "block";
      } else {
        charImgElement.style.display = "none";
        charImgElement.src = ""; // Очищаем путь, если персонажа нет
      }
      
      // 3. Управление кнопками
      const nextBtn = document.getElementById("next-btn");
      const choicesContainer = document.getElementById("choices-container");
      
      choicesContainer.innerHTML = "";

      if (scene.type === "text") {
        nextBtn.style.display = "block";
        choicesContainer.style.display = "none";
        
        nextBtn.onclick = () => {
          if (scene.next) {
            currentStep = scene.next;
            renderScene();
          } else {
            alert("Конец игры!");
          }
        };
      } else if (scene.type === "choice") {
        nextBtn.style.display = "none";
        choicesContainer.style.display = "flex";
        
        scene.choices.forEach(choice => {
          const button = document.createElement("button");
          button.className = "clickable choice-btn";
          button.innerText = choice.text;
          button.onclick = () => {
            currentStep = choice.next;
            renderScene();
          };
          choicesContainer.appendChild(button);
        });
      }
    }

    window.onload = renderScene;
  </script>
</body>
</html>
